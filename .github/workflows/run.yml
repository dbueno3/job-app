name: jobbot

# Fetch, filter, and email new SWE matches: hit-list alerts immediately, everyone
# else at 7am / 9pm ET. jobs.db lives on the `data` branch:
# `jobbot run --sync` pulls it, applies this run, and pushes it back with
# --force-with-lease (retrying on top of any concurrent `jobbot sync` from my laptop).
on:
  schedule:
    # Hourly at :07, except 1-4am ET (quiet hours, to save Actions minutes; another
    # private repo shares them). :07 dodges top-of-hour scheduler congestion. The
    # timezone key (GitHub, Mar 2026) keeps the quiet hours right across DST. Runs
    # may start late; digest timing is decided in Python (first run at/after
    # 7am and 9pm ET), so a late run just sends a little later.
    - cron: "7 0,5-23 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write # to push the data branch

# Never run two at once: both would email the same jobs. (Laptop syncs aren't in this
# group; the lease + re-apply handles those.)
concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # persists the token, so jobbot's git push works

      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags; pin exact
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Run jobbot
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: uv run jobbot run --sync

      # A schema migration copies jobs.db to data/backups/ first; keep that copy.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jobs-db-pre-migration-${{ github.run_id }}
          path: data/backups/
          retention-days: 90
          if-no-files-found: ignore
