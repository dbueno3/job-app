name: jobbot

# Fetch, filter, and email new SWE matches. jobs.db lives on the `data` branch:
# `jobbot run --sync` pulls it, applies this run, and pushes it back with
# --force-with-lease (retrying on top of any concurrent `jobbot sync` from my laptop).
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC) until phase 5; GitHub may start runs late
  workflow_dispatch:

permissions:
  contents: write # to push the data branch

# Never run two at once: both would email the same jobs. (Laptop syncs aren't in this
# group; the lease + re-apply handles those.)
concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # persists the token, so jobbot's git push works

      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags; pin exact
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Run jobbot
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: uv run jobbot run --sync
